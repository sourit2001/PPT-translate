app = "ppt-translate-app" # 替换为你的 Fly 应用名
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = 5

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  processes = ["app"]
  protocol = "tcp"
  internal_port = 3000
  [[services.ports]]
    port = 80
  [[services.ports]]
    port = 443

[checks]
  [checks.web]
    port = 3000
    type = "http"
    interval = "30s"
    timeout = "2s"
    path = "/api/health"

[processes]
  app = "bash /app/infra/scripts/start.sh web"
  worker = "bash /app/infra/scripts/start.sh worker"
